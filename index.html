<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adivinha e Mostra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,700;1,9..144,560&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6efe2;
      --ink: #1d2b22;
      --muted: #5e6d63;
      --card: #fffdf8;
      --line: #e6d8c4;
      --primary: #e07a2f;
      --primary-fg: #fffaf4;
      --good: #2c7a49;
      --good-bg: #e5f5ea;
      --soft: #fff4e8;
      --shadow: 0 16px 40px rgba(70, 42, 16, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at top, #fff8ea 0%, var(--bg) 46%);
      color: var(--ink);
      font-family: Nunito, sans-serif;
    }

    button, input { font: inherit; }

    .app {
      width: min(680px, 100%);
      margin: 0 auto;
      min-height: 100dvh;
      padding: 28px 20px 36px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .kicker {
      margin: 0;
      font-family: Fraunces, serif;
      font-style: italic;
      font-size: 1.35rem;
      color: var(--primary);
    }

    h1 {
      margin: 0;
      font-family: Fraunces, serif;
      font-size: clamp(3.2rem, 12vw, 4.6rem);
      line-height: 0.9;
      letter-spacing: -0.03em;
    }

    h1 span {
      display: block;
      font-style: italic;
      color: var(--primary);
    }

    .lede, .note, .score-line, .progress {
      margin: 0;
      color: var(--muted);
      font-size: 1.12rem;
      line-height: 1.45;
    }

    .langs, .choices {
      display: grid;
      gap: 10px;
    }

    .langs { grid-template-columns: 1fr 1fr; }

    .choice, .primary, .ghost, .lang {
      border: 2px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      min-height: 56px;
      padding: 12px 18px;
      cursor: pointer;
    }

    .lang[aria-checked="true"], .primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-fg);
    }

    .choice {
      border-radius: 22px;
      text-align: left;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .choice:hover, .lang:hover, .ghost:hover, .primary:hover { transform: translateY(-1px); }

    .choice.right {
      background: var(--good-bg);
      border-color: var(--good);
      color: var(--good);
    }

    .choice.wrong {
      background: var(--soft);
      border-color: #e2b48a;
    }

    .choice:disabled { cursor: default; transform: none; }

    .primary, .ghost { font-weight: 800; font-size: 1.15rem; }

    .ghost { background: transparent; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .best {
      font-family: Fraunces, serif;
      font-size: 2rem;
      color: var(--ink);
    }

    .scores, .starts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .voice {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
    }

    .frame {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      background: #1b2420;
      box-shadow: var(--shadow);
      aspect-ratio: 4 / 3;
    }

    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.12) saturate(0.2);
      transform: scale(1.04);
      transition: filter 0.7s ease, transform 0.7s ease;
    }

    .frame.lit img {
      filter: none;
      transform: none;
    }

    .frame p {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      margin: 0;
      color: #fff8ee;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    }

    .frame.lit p { display: none; }

    .question {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 1.9rem);
      line-height: 1.25;
    }

    .icon-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: var(--card);
      cursor: pointer;
      font-size: 1.3rem;
    }

    .note {
      background: var(--card);
      border-radius: 20px;
      padding: 14px 16px;
      color: var(--ink);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .gallery figure {
      margin: 0;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 14px;
    }

    .gallery figcaption {
      margin-top: 4px;
      font-size: 0.72rem;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 560px) {
      .gallery { grid-template-columns: repeat(2, 1fr); }
      .gallery figcaption { font-size: 0.9rem; }
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="app">
    <section id="menu">
      <p class="kicker" id="place"></p>
      <h1 id="title"></h1>
      <p class="lede" id="intro"></p>
      <div class="langs" role="radiogroup" id="langs"></div>
      <div class="scores">

        <p class="score-line"><span id="best-long-label"></span> <span class="best" id="best-long"></span> / 10</p>
      </div>
      <label class="voice"><input type="checkbox" id="voice" checked /> <span id="voice-label"></span></label>
      <div class="starts">
        <button class="primary" id="start-short" type="button"></button>
        <button class="primary" id="start-long" type="button"></button>
      </div>
    </section>

    <section id="play" hidden>
      <div class="row">
        <p class="progress" id="progress"></p>
        <button class="icon-btn" id="speak" type="button" aria-label="Read aloud">🔊</button>
      </div>
      <div class="frame" id="frame">
        <img id="photo" alt="" />
        <p id="wait"></p>
      </div>
      <h2 class="question" id="question"></h2>
      <div class="choices" id="choices"></div>
      <p class="note" id="note" hidden></p>
      <button class="primary" id="next" type="button" hidden></button>
    </section>

    <section id="done" hidden>
      <p class="kicker" id="done-kicker"></p>
      <h1 id="done-title"></h1>
      <p class="lede" id="done-score"></p>
      <div class="gallery" id="gallery"></div>
      <button class="primary" id="again" type="button"></button>
      <button class="ghost" id="home" type="button"></button>
    </section>
  </main>

    document.documentElement.lang = state.lang === "pt" ? "pt-BR" : "en";
    document.getElementById("voice").checked = state.voiceOn;

    function t(key) {
      return TEXT[state.lang][key];
    }

    function say(parts) {
      if (!state.voiceOn || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const locale = state.lang === "pt" ? "pt-BR" : "en-US";
      const voice = window.speechSynthesis.getVoices().find((item) => item.lang.toLowerCase().startsWith(locale.toLowerCase()));
      parts.filter(Boolean).forEach((text) => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = locale;
        utterance.rate = 0.95;
        if (voice) utterance.voice = voice;
        window.speechSynthesis.speak(utterance);
      });
    }

    function show(which) {
      menu.hidden = which !== "menu";
      play.hidden = which !== "play";
      done.hidden = which !== "done";
    }

    function renderMenu() {
      document.getElementById("place").textContent = t("place");
      document.getElementById("title").innerHTML = t("titleA") + "<span>" + t("titleB") + "</span>";
      document.getElementById("intro").textContent = t("intro");
      document.getElementById("best-short-label").textContent = t("bestShort");
      document.getElementById("best-long-label").textContent = t("bestLong");
      document.getElementById("best-short").textContent = String(state.bestShort);
      document.getElementById("best-long").textContent = String(state.bestLong);
      document.getElementById("voice-label").textContent = t("voice");
      document.getElementById("start-short").textContent = t("short");
      document.getElementById("start-long").textContent = t("long");
      const langs = document.getElementById("langs");
      langs.setAttribute("aria-label", state.lang === "pt" ? "Idioma" : "Language");
      langs.replaceChildren();
      [["pt", "Português"], ["en", "English"]].forEach(([code, label]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "lang";
        button.setAttribute("role", "radio");
        button.setAttribute("aria-checked", String(code === state.lang));
        button.textContent = label;
        button.addEventListener("click", () => {
          state.lang = code;
          localStorage.setItem("adivinhe-lang", code);
          document.documentElement.lang = code === "pt" ? "pt-BR" : "en";
          renderMenu();
        });
        langs.appendChild(button);
      });
    }

    function shuffleChoices(question) {
      const items = question.options.map((option, index) => ({ option, correct: index === 0 }));
      for (let i = items.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    function drawRound(count) {
      const pool = QUESTIONS.slice();
      for (let i = pool.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, count);
    }

    function begin(count) {
      state.length = count;
      state.round = drawRound(count);
      state.index = 0;
      state.score = 0;
      show("play");
      renderQuestion(true);
    }

    function renderQuestion(speakIt) {
      const question = state.round[state.index];
      state.order = shuffleChoices(question);
      state.locked = false;
      document.getElementById("progress").textContent = (state.index + 1) + " / " + state.round.length;
      document.getElementById("question").textContent = question.q[state.lang];
      const frame = document.getElementById("frame");
      frame.classList.remove("lit");
      const photo = document.getElementById("photo");
      photo.src = question.image;
      photo.alt = "";
      document.getElementById("wait").textContent = t("wait");
      document.getElementById("note").hidden = true;
      const next = document.getElementById("next");
      next.hidden = true;
      next.textContent = state.index === state.round.length - 1 ? t("see") : t("next");
      const choices = document.getElementById("choices");
      choices.replaceChildren();
      state.order.forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.textContent = item.option[state.lang];
        button.addEventListener("click", () => answer(item, button));
        choices.appendChild(button);
      });
      if (speakIt) {
        say([question.q[state.lang], ...state.order.map((item) => item.option[state.lang])]);
      }
    }

    function answer(item, button) {
      if (state.locked) return;
      state.locked = true;
      const question = state.round[state.index];
      const correct = state.order.find((entry) => entry.correct);
      document.querySelectorAll(".choice").forEach((choice) => {
        choice.disabled = true;
        if (choice.textContent === correct.option[state.lang]) choice.classList.add("right");
      });
      if (item.correct) {
        state.score += 1;
      } else {
        button.classList.add("wrong");
      }
      document.getElementById("frame").classList.add("lit");
      document.getElementById("photo").alt = question.name[state.lang];
      const note = document.getElementById("note");
      const lead = item.correct ? t("yes") : t("almost") + " " + t("answer") + " " + correct.option[state.lang] + ".";
      note.hidden = false;
      note.textContent = lead + " " + question.note[state.lang];
      document.getElementById("next").hidden = false;
      say([lead, question.note[state.lang]]);
    }

    function finish() {
      const bestKey = state.length === 5 ? "bestShort" : "bestLong";
      const storageKey = state.length === 5 ? "adivinhe-best-5" : "adivinhe-best-10";
      if (state.score > state[bestKey]) {
        state[bestKey] = state.score;
        localStorage.setItem(storageKey, String(state.score));
      }
      document.getElementById("done-kicker").textContent = t("place");
      document.getElementById("done-title").textContent = t("done");
      document.getElementById("done-score").textContent = state.score + " " + t("of") + " " + state.length;
      document.getElementById("again").textContent = t("again");
      document.getElementById("home").textContent = t("home");
      const gallery = document.getElementById("gallery");
      gallery.replaceChildren();
      state.round.forEach((question) => {
        const figure = document.createElement("figure");
        const img = document.createElement("img");
        img.src = question.image;
        img.alt = question.name[state.lang];
        const caption = document.createElement("figcaption");
        caption.textContent = question.name[state.lang];
        figure.append(img, caption);
        gallery.appendChild(figure);
      });
      show("done");
      say([t("done"), state.score + " " + t("of") + " " + state.length]);
    }

    document.getElementById("voice").addEventListener("change", (event) => {
      state.voiceOn = event.target.checked;
      localStorage.setItem("adivinhe-voice", state.voiceOn ? "on" : "off");
      if (!state.voiceOn && window.speechSynthesis) window.speechSynthesis.cancel();
    });

    document.getElementById("start-short").addEventListener("click", () => begin(5));
    document.getElementById("start-long").addEventListener("click", () => begin(10));

    document.getElementById("speak").addEventListener("click", () => {
      const question = state.round[state.index];
      if (state.locked) {
        say([document.getElementById("note").textContent]);
      } else {
        say([question.q[state.lang], ...state.order.map((item) => item.option[state.lang])]);
      }
    });

    document.getElementById("next").addEventListener("click", () => {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (state.index === state.round.length - 1) finish();
      else {
        state.index += 1;
        renderQuestion(true);
      }
    });

    document.getElementById("again").addEventListener("click", () => begin(state.length));

    document.getElementById("home").addEventListener("click", () => {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      renderMenu();
      show("menu");
    });

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    renderMenu();
  </script>
</body>
</html>
